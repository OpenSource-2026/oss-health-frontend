server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container. This makes the app
    # same-origin: the browser only ever talks to this host:port, so it works
    # no matter how the page is reached — including a phone opening the QR
    # share link via the laptop's LAN IP. (Removes the localhost hardcoding
    # and the cross-origin CORS dependency for the integrated demo.)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: serve index.html for any unmatched path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
